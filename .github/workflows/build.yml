# Builds the runtime bundles from versions.sh. Every run uploads them as workflow artifacts;
# with "release" set, a run on main also publishes them as the GitHub release
# <python>-r<revision> (refusing to replace an existing one: bump REVISION instead).
name: Build runtime

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the release (main only)
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-i686:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7 # v7.0.1

      - name: Downloaded sources
        uses: actions/cache@v6 # v6.1.0
        with:
          path: out/src
          key: sources-${{ hashFiles('versions.sh') }}

      - name: Build
        run: ./build-linux.sh out

      - uses: actions/upload-artifact@v7 # v7.0.2
        with:
          name: bundle-linux-i686
          path: |
            out/*.tar.gz
            out/*.tar.gz.sha256

      - uses: actions/upload-artifact@v7 # v7.0.2
        if: always()
        with:
          name: logs-linux-i686
          path: out/logs/

  release:
    needs: linux-i686
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # v7.0.1
      - uses: actions/download-artifact@v8 # v8.0.2
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./versions.sh
          TAG=$PYTHON-r$REVISION
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; bump REVISION in versions.sh"; exit 1
          fi
          (cd dist && cat ./*.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Python $PYTHON runtime for Source.Python, revision $REVISION. Built from $GITHUB_SHA; versions in versions.sh." \
            dist/*.tar.gz dist/SHA256SUMS
